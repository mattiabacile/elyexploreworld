<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gestione racconti — ElyExploreWorld</title>
  <link rel="stylesheet" href="login.css?v=909b054184a4">
  <link rel="stylesheet" href="editor.css?v=431fde3c5a7f">
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <main id="cms-login" class="cms-login">
    <a class="cms-brand" href="/">ElyExploreWorld</a>
    <h1>Il tuo spazio per raccontare.</h1>
    <p>Gestisci racconti, consigli di viaggio e fotografie.</p>
    <form id="cms-login-form" hidden>
      <label for="cms-username">Nome utente</label>
      <input id="cms-username" name="username" autocomplete="username" required minlength="3" maxlength="50" autocapitalize="none" spellcheck="false">
      <label for="cms-password">Password</label>
      <input id="cms-password" name="password" type="password" autocomplete="current-password" required minlength="14" maxlength="256">
      <div id="cms-confirmation" hidden>
        <label for="cms-confirm">Conferma password</label>
        <input id="cms-confirm" name="confirm" type="password" autocomplete="new-password" minlength="14" maxlength="256">
        <p class="cms-hint">Scegli una password di almeno 14 caratteri. Conservala per i prossimi accessi.</p>
      </div>
      <button type="submit">Accedi</button>
    </form>
    <p id="cms-login-status" role="status" aria-live="polite">Caricamento del pannello…</p>
    <button type="button" id="cms-retry" hidden>Riprova ad aprire il pannello</button>
    <a class="cms-home" href="/">Torna al sito</a>
  </main>
  <noscript>Attiva JavaScript per accedere al pannello dei racconti.</noscript>
  <script src="../vendor/marked.js?v=f424dcb508fd"></script>
  <script src="../vendor/dompurify.js?v=2c90a9b46d64"></script>
  <script src="../article-presentation.js?v=7440c3d9929a"></script>
  <script src="editor.js?v=857aecbaff1c"></script>
  <script src="visual-editor.js?v=c1866aad2fa9"></script>
  <script src="access.js?v=d4028a085f53"></script>
</body>
</html>
